<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Ezra Schwartz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="ProjectStyle.css">
    <style>
        .resume-container {
            margin: 8rem auto 4rem;
            max-width: 1200px;
            padding: 0 2rem;
        }

        .resume-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .resume-header h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #0f3460, #16213e);
            color: #ffffff;
            padding: 1rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 52, 96, 0.4);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .pdf-viewer {
            width: 100%;
            min-height: 100vh;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background-color: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .pdf-viewer embed,
        .pdf-viewer iframe {
            width: 100%;
            min-height: 500px;
            height: auto;
            border-radius: 12px;
        }

        .no-resume-message {
            background-color: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            color: #b0b0b0;
        }

        .no-resume-message h2 {
            color: #ffffff;
            margin-bottom: 1rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .resume-header h1 {
                font-size: 2rem;
            }

            .download-btn {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }

            .resume-container {
                margin: 6rem auto 2rem;
                padding: 0 1rem;
            }

            .pdf-viewer {
                min-height: 70vh;
            }

            .pdf-viewer embed,
            .pdf-viewer iframe {
                min-height: 1000px;
            }
        }

        @media (max-width: 480px) {
            .resume-header h1 {
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }

            .download-btn {
                padding: 0.7rem 1.2rem;
                font-size: 0.9rem;
            }

            .resume-container {
                margin: 5rem auto 2rem;
                padding: 0 0.5rem;
            }

            .pdf-viewer {
                min-height: 60vh;
            }

            .pdf-viewer embed,
            .pdf-viewer iframe {
                min-height: 800px;
            }

            .no-resume-message {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>

<body>
    <canvas id="tspCanvas" style="position: fixed; top: 0; left: 0; z-index: -1;"></canvas>

    <header>
        <nav>
            <ul class="container">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="#top">Resume</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="resume-container">
            <div class="resume-header">
                <h1>My Resume</h1>
                <a href="EzraSchwartzResume.pdf" download="EzraSchwartzResume.pdf" class="download-btn" id="downloadBtn">
                    Download PDF
                </a>
            </div>

            <div class="pdf-viewer" id="pdfViewer">
            </div>
        </div>
    </main>

    <footer>
        <p>Connect with me on <a href="https://www.linkedin.com/in/ezra-schwartz-64213b2ba/">LinkedIn</a> | <a href="https://github.com/EzrSchwartz">GitHub</a></p>
    </footer>

    <script src="tspanimation.js"></script>
    <script>
        // Check if resume.pdf exists and display it
        const pdfViewer = document.getElementById('pdfViewer');
        const downloadBtn = document.getElementById('downloadBtn');
        const resumePath = 'EzraSchwartzResume.pdf';

        // Try to load the PDF
        fetch(resumePath, { method: 'HEAD' })
            .then(response => {
                if (response.ok) {
                    // PDF exists, embed it
                    pdfViewer.innerHTML = `<embed src="${resumePath}#toolbar=0&scrollbar=0" type="application/pdf">`;
                } else {
                    // PDF doesn't exist, show message
                    showNoResumeMessage();
                }
            })
            .catch(() => {
                // Error loading PDF, show message
                showNoResumeMessage();
            });

        function showNoResumeMessage() {
            pdfViewer.innerHTML = `
                <div class="no-resume-message">
                    <h2>Resume Coming Soon</h2>
                    <p>Please add your resume.pdf file to the public folder to display it here.</p>
                </div>
            `;
            downloadBtn.style.display = 'none';
        }
    </script>
</body>
</html>
